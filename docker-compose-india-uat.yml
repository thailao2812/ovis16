# Odoo 16 India (UAT) with its own PostgreSQL, running next to the Odoo 18 stack (sud18-india-uat)
# on the same host. Nothing is shared with that stack: own project name, network, ports and data folders.
#
# Host ports
#   Odoo 16 web          8169            -> container 8069   (Odoo 18 uses 8069)
#   Odoo 16 websocket    8172            -> container 8072   (Odoo 18 uses 8072)
#   PostgreSQL 16        127.0.0.1:5433  -> container 5432   (Odoo 18's database uses 127.0.0.1:5432)
#
# Odoo reaches its database inside this compose network as db:5432. Port 5433 is only for tools on the
# host (psql -h 127.0.0.1 -p 5433 -U odoo). Never put db_port = 5433 in the Odoo config.
#
# First start, from the folder that holds this file (the ovis16 checkout):
#   sudo mkdir -p /opt/ovis16-data/postgres /opt/ovis16-data/odoo
#   sudo chown -R 101:101 /opt/ovis16-data/odoo     # uid/gid of the odoo user in the image
#   set admin_passwd in config/odoo-india-uat.conf
#   sudo docker compose -f docker-compose-india-uat.yml up -d --build
#
# Always pass -f docker-compose-india-uat.yml: the project name below keeps "down" or "restart" from
# touching the Odoo 18 containers.
name: ovis16-india-uat

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${OVIS16_DB_PASSWORD:-odoo}
    volumes:
      - /opt/ovis16-data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    shm_size: 1gb
    restart: unless-stopped

  odoo:
    build:
      context: ./docker/india16       # small folder on purpose: the whole repo is ~750 MB
    image: ovis16-india:16
    depends_on:
      - db
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${OVIS16_DB_PASSWORD:-odoo}
    volumes:
      - ./config/odoo-india-uat.conf:/etc/odoo/odoo.conf:ro
      - ./:/opt/ovis16:ro
      - /opt/ovis16-data/odoo:/var/lib/odoo
    ports:
      - "8169:8069"
      - "8172:8072"
    restart: unless-stopped
