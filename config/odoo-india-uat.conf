[options]
; Odoo 16 India - UAT, used by docker-compose-india-uat.yml.
; The database connection comes from the compose environment (HOST, PORT, USER, PASSWORD).
; Do not add db_host / db_port / db_user / db_password here: they would override the environment,
; and inside Docker the database is db:5432 (5433 is only the host-side port).
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/ovis16/addons-sud,/opt/ovis16/addons-sud/base_restapi,/opt/ovis16/india_sucden,/opt/ovis16/vietnam_sucden,/opt/ovis16/vietnam_sucden/gg_map,/opt/ovis16/vietnam_sucden/gg_map/web_view_google_map_drawing/example,/opt/ovis16/tools,/opt/ovis16/tools/server_auth
data_dir = /var/lib/odoo

; Master password for the database manager. Set a strong value before the first start.
admin_passwd = CHANGE_ME_BEFORE_FIRST_START

workers = 2
max_cron_threads = 1
limit_time_real = 1200
limit_time_cpu = 600
; Set to True only when a reverse proxy (nginx) sits in front of Odoo.
proxy_mode = False
