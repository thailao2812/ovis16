version: '3.8'
services:
  odoo:
    container_name: ovis-web
    image: odoo:16.0
    depends_on:
      - db
    ports:
      - 8069:8069
      - 8072:8072
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DATABASE=odoo
      - DB_PORT=5432
    volumes:
      - /opt/ovis16:/opt/ovis
    restart: always

  db:
    image: postgres:16
    container_name: ovis-db
    ports:
      - 5432:5432
    shm_size: '2gb'
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: always

volumes:
  odoo-db-data:
