version: '3.8'

services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile_ned
    container_name: odoo_container
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DATABASE=odoo
      - DB_PORT=5432
    volumes:
      - /opt/ovis16:/opt/ovis
      - /opt/deforestation_layers:/opt/deforestation_layers
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: odoo_db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

volumes:
  odoo-db-data: